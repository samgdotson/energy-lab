name: 2021TX
channels:
  - conda-forge
  - bioconda
dependencies:
  - python < 3.14
  - pip==21.1
  - ipython
  - matplotlib
  - pandas
  - geopandas
  - numpy==2.2.6
  - scipy>=1.13
  - ipykernel
  - jupyterlab
  - seaborn
  - pypsa
  - plotly
  - pyarrow
  - iprogress
  - pyogrio
  - fiona
  - snakemake-minimal
  - pip:
    - python-dotenv
    - highspy
    - us
    - census
    - pandapower[all]
    - PYPOWER
    - pymatreader
    - cartopy
    - haversine
    - six==1.15.0